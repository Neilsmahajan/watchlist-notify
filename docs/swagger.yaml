basePath: /
definitions:
  github_com_neilsmahajan_watchlist-notify_internal_models.DigestSettings:
    properties:
      enabled:
        type: boolean
      interval:
        description: '>=1'
        type: integer
      interval_unit:
        description: e.g. "days", "weeks", "months"
        type: string
      last_sent_at:
        type: string
      next_scheduled_at:
        type: string
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_models.IMDbSync:
    properties:
      added:
        description: |-
          Added, Removed and Unmatched are counts from the last run. Unmatched
          are IMDb titles TMDb has no movie or show for (episodes, games, …).
        type: integer
      last_attempt_at:
        description: LastAttemptAt is when the list was last fetched, successfully
          or not.
        type: string
      last_error:
        type: string
      last_status:
        description: ok | partial | failed | not_found
        type: string
      last_synced_at:
        description: LastSyncedAt is when the list was last read completely.
        type: string
      linked_at:
        type: string
      removed:
        type: integer
      source_id:
        description: |-
          SourceID is an IMDb user ID (ur…, meaning that user's Watchlist) or a
          list ID (ls…).
        type: string
      total:
        description: Total is the number of entries IMDb reported for the list.
        type: integer
      unmatched:
        type: integer
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_models.Preferences:
    properties:
      digest:
        $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.DigestSettings'
      digest_consent:
        type: boolean
      marketing_consent:
        type: boolean
      notify_email:
        type: string
      use_account_email:
        type: boolean
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_models.ServiceSubscription:
    properties:
      active:
        type: boolean
      added_at:
        type: string
      code:
        description: e.g. "netflix"
        type: string
      plan:
        description: optional
        type: string
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      imdb_sync:
        allOf:
        - $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.IMDbSync'
        description: IMDbSync is present while the user has a public IMDb list linked.
      name:
        type: string
      picture:
        type: string
      preferences:
        $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.Preferences'
      region:
        type: string
      services:
        items:
          $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.ServiceSubscription'
        type: array
      updated_at:
        type: string
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_models.WatchlistItem:
    properties:
      added_at:
        type: string
      id:
        type: string
      imdb_id:
        type: string
      imdb_missing_since:
        description: |-
          IMDbMissingSince is set by the IMDb sync when a complete fetch of the
          user's linked list no longer contains this item. It is the first of the
          two strikes the sync needs before it removes an item; seeing the title
          on the list again clears it.
        type: string
      source:
        description: Source is SourceIMDb, SourceCSV, or empty for items added by
          hand.
        type: string
      status:
        description: 'enum: planned | watching | finished'
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      tmdb_id:
        type: integer
      type:
        description: 'enum: movie | show (See constants)'
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      year:
        type: integer
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_watchlist.Availability:
    properties:
      checked_at:
        type: string
      elsewhere:
        description: |-
          Elsewhere is everything else: services the user does not have, and
          rent or buy offers.
        items:
          $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_watchlist.Provider'
        type: array
      link:
        description: Link is TMDb's "where to watch" page for the title and region.
        type: string
      providers:
        description: Providers are the user's active services that stream the title.
        items:
          $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_watchlist.Provider'
        type: array
      region:
        type: string
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_watchlist.Facets:
    properties:
      available:
        description: |-
          Available and Unavailable split the same items by whether one of the
          user's active services streams them.
        type: integer
      services:
        additionalProperties:
          type: integer
        description: |-
          Services counts items streaming on each service code, for every
          service that streams at least one.
        type: object
      status:
        additionalProperties:
          type: integer
        description: Status counts items per status.
        type: object
      unavailable:
        type: integer
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_watchlist.Item:
    properties:
      added_at:
        type: string
      availability:
        allOf:
        - $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_watchlist.Availability'
        description: |-
          Availability is null when the title has no stored snapshot: it is not
          linked to TMDb, TMDb no longer has it, or the fetch has not succeeded yet.
      genres:
        items:
          type: string
        type: array
      id:
        type: string
      imdb_id:
        type: string
      imdb_missing_since:
        description: |-
          IMDbMissingSince is set by the IMDb sync when a complete fetch of the
          user's linked list no longer contains this item. It is the first of the
          two strikes the sync needs before it removes an item; seeing the title
          on the list again clears it.
        type: string
      overview:
        type: string
      poster_path:
        type: string
      rating:
        type: number
      runtime:
        type: integer
      source:
        description: Source is SourceIMDb, SourceCSV, or empty for items added by
          hand.
        type: string
      status:
        description: 'enum: planned | watching | finished'
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      tmdb_id:
        type: integer
      type:
        description: 'enum: movie | show (See constants)'
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      year:
        type: integer
    type: object
  github_com_neilsmahajan_watchlist-notify_internal_watchlist.Provider:
    properties:
      access:
        description: subscription | free | ads | rent | buy
        items:
          type: string
        type: array
      code:
        description: Code is our service code; empty for providers we do not model.
        type: string
      logo_path:
        type: string
      name:
        type: string
    type: object
  internal_server.AvailabilityItemResponse:
    properties:
      providers:
        items:
          $ref: '#/definitions/internal_server.ProviderInfo'
        type: array
      unmatched_user_services:
        items:
          type: string
        type: array
    type: object
  internal_server.AvailabilityResponse:
    properties:
      providers:
        items:
          $ref: '#/definitions/internal_server.ProviderInfo'
        type: array
      region:
        type: string
      unmatched_user_services:
        items:
          type: string
        type: array
    type: object
  internal_server.BatchAvailabilityRequest:
    properties:
      items:
        items:
          properties:
            id:
              type: integer
            type:
              description: '"movie" or "tv"'
              type: string
          required:
          - id
          - type
          type: object
        type: array
      region:
        type: string
    required:
    - items
    type: object
  internal_server.BatchAvailabilityResponse:
    properties:
      region:
        type: string
      results:
        additionalProperties:
          $ref: '#/definitions/internal_server.AvailabilityItemResponse'
        type: object
    type: object
  internal_server.ErrorResponse:
    description: Standard error response structure used across all endpoints
    properties:
      error:
        example: invalid request
        type: string
    type: object
  internal_server.IMDbLinkRequest:
    properties:
      source:
        description: |-
          Source is an IMDb user ID (ur…), a list ID (ls…), or an IMDb URL
          containing one.
        example: https://www.imdb.com/user/ur12345678/watchlist
        type: string
    type: object
  internal_server.IMDbLinkResponse:
    properties:
      imdb_sync:
        $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.IMDbSync'
      result:
        $ref: '#/definitions/internal_server.IMDbLinkResult'
    type: object
  internal_server.IMDbLinkResult:
    properties:
      added:
        description: Added is how many of them became new watchlist items.
        example: 230
        type: integer
      complete:
        description: |-
          Complete is false when the list was only partly read or some titles
          are still to be looked up; the daily sync finishes the job.
        example: true
        type: boolean
      existing:
        description: Existing is how many were already on the watchlist.
        example: 10
        type: integer
      total:
        description: Total is the number of titles on the IMDb list.
        example: 242
        type: integer
      unmatched:
        description: Unmatched is how many TMDb does not know, so they cannot be tracked.
        example: 2
        type: integer
    type: object
  internal_server.ProviderInfo:
    properties:
      access:
        items:
          type: string
        type: array
      code:
        type: string
      link:
        type: string
      logo_path:
        type: string
      name:
        type: string
    type: object
  internal_server.WatchlistImportResponse:
    properties:
      duplicates:
        description: |-
          Duplicates counts rows the user already had, or that repeat an
          earlier row of the file.
        example: 230
        type: integer
      errors:
        description: Errors lists rows that were not imported, in file order.
        items:
          $ref: '#/definitions/internal_server.WatchlistRowError'
        type: array
      imported:
        description: Imported counts rows that became new watchlist items.
        example: 12
        type: integer
    type: object
  internal_server.WatchlistListMeta:
    properties:
      facets:
        $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_watchlist.Facets'
      limit:
        type: integer
      next_offset:
        description: NextOffset is present when there are more items after this page.
        type: integer
      offset:
        type: integer
      region:
        description: Region is the region availability is reported for.
        type: string
      returned:
        type: integer
      total:
        description: Total is the number of items matching the filters, before paging.
        type: integer
    type: object
  internal_server.WatchlistListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_watchlist.Item'
        type: array
      meta:
        $ref: '#/definitions/internal_server.WatchlistListMeta'
    type: object
  internal_server.WatchlistRowError:
    properties:
      reason:
        example: no tmdb match for imdb id tt0000001
        type: string
      row:
        description: Row is the line of the file, counting the header as row 1.
        example: 7
        type: integer
    type: object
host: api.watchlistnotify.com
info:
  contact:
    email: contact@watchlistnotify.com
    name: Watchlist Notify Support
    url: https://watchlistnotify.com/contact
  description: |-
    API for managing movie and TV show watchlists with streaming availability notifications across multiple platforms.

    Features:
    - User profile and preferences management
    - Watchlist CRUD operations for movies and TV shows
    - Streaming service subscription management
    - Real-time availability checking via TMDb
    - Digest email notifications with customizable schedules
    - Content search and discovery
  license:
    name: MIT
    url: https://github.com/neilsmahajan/watchlist-notify/blob/main/LICENCE
  title: Watchlist Notify API
  version: 0.9.0
paths:
  /api/availability/{id}:
    get:
      description: Check which of the user's subscribed services have a specific movie
        or TV show available. Served from stored availability (refreshed daily); TMDb
        is called only for a title that is not stored yet.
      parameters:
      - description: TMDb content ID
        in: path
        name: id
        required: true
        type: integer
      - description: Content type
        enum:
        - movie
        - tv
        in: query
        name: type
        required: true
        type: string
      - description: ISO 3166-1 region code (defaults to user's region or US)
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Availability details for user's services
          schema:
            $ref: '#/definitions/internal_server.AvailabilityResponse'
        "400":
          description: Invalid ID or type
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Failed to load availability
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "502":
          description: Upstream TMDb API error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "503":
          description: Availability service unavailable
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "504":
          description: Availability lookup timed out
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get streaming availability
      tags:
      - Availability
  /api/availability/batch:
    post:
      consumes:
      - application/json
      description: Check availability for multiple movies/TV shows across user's subscribed
        services in a single request. Served from stored availability; prefer GET
        /api/watchlist, which already embeds availability for every item.
      parameters:
      - description: List of items to check (max 500)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_server.BatchAvailabilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Batch availability results
          schema:
            $ref: '#/definitions/internal_server.BatchAvailabilityResponse'
        "400":
          description: Invalid request body or exceeds batch size limit
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Failed to load availability
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Batch check streaming availability
      tags:
      - Availability
  /api/me:
    get:
      description: Returns the authenticated user's complete profile including preferences
        and service subscriptions
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
  /api/me/imdb:
    delete:
      description: 'Stops syncing with the linked IMDb list. Nothing is removed from
        the watchlist: items the sync added stay, and are never removed automatically
        afterwards. Unlinking when nothing is linked also succeeds.'
      responses:
        "204":
          description: Unlinked
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: The link could not be removed
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unlink the IMDb list
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: 'Links the user''s public IMDb Watchlist (by user ID, ur…) or any
        public IMDb list (ls…), adds its titles to the watchlist now, and keeps the
        watchlist in step with it once a day from then on. Linking again replaces
        the link. Titles are added as planned items with source "imdb"; items the
        user already has are left as they are. The daily sync removes an item only
        if the sync added it, the user has not changed its status or tagged it, and
        it has been missing from two complete fetches of the list at least 12 hours
        apart. IMDb does not permit public or commercial use of its data, so this
        is strictly opt-in, stores only IMDb title IDs (everything else comes from
        TMDb), and reads a list at most once a day: there is no "sync now", and a
        second link attempt within 60 seconds is refused.'
      parameters:
      - description: The IMDb user ID, list ID or URL to link
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_server.IMDbLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The stored link and what the first sync did
          schema:
            $ref: '#/definitions/internal_server.IMDbLinkResponse'
        "400":
          description: Not an IMDb user ID, list ID or URL; or the list is too large
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "404":
          description: IMDb has no such list, or it is not public
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "429":
          description: A link was attempted less than 60 seconds ago
          headers:
            Retry-After:
              description: Seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: The link could not be stored
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "502":
          description: IMDb could not be reached
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "503":
          description: IMDb sync is not configured on this server
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Link a public IMDb list
      tags:
      - Users
  /api/me/notifications/test:
    post:
      consumes:
      - application/json
      description: Send a test digest email to verify email configuration and preview
        digest format
      parameters:
      - description: Test notification configuration
        in: body
        name: body
        schema:
          properties:
            override_email:
              type: string
            type:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Test notification sent successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid email or request
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Failed to send notification
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "503":
          description: Notification service not configured
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send test notification email
      tags:
      - Notifications
  /api/me/preferences:
    patch:
      consumes:
      - application/json
      description: Update user notification preferences, digest settings, and email
        configuration
      parameters:
      - description: User preferences update
        in: body
        name: body
        required: true
        schema:
          properties:
            digest_consent:
              type: boolean
            digest_enabled:
              type: boolean
            digest_interval:
              type: integer
            digest_interval_unit:
              type: string
            marketing_consent:
              type: boolean
            notify_email:
              type: string
            use_account_email:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated user profile
          schema:
            $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.User'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Failed to update preferences
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user preferences
      tags:
      - Users
  /api/me/services:
    get:
      description: Get all available streaming services with the user's subscription
        status
      produces:
      - application/json
      responses:
        "200":
          description: List of services with subscription status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List streaming services
      tags:
      - Services
    patch:
      consumes:
      - application/json
      description: Add, remove, or toggle streaming service subscriptions for the
        authenticated user
      parameters:
      - description: Service subscription changes
        in: body
        name: body
        required: true
        schema:
          properties:
            add:
              items:
                type: string
              type: array
            remove:
              items:
                type: string
              type: array
            toggle:
              items:
                properties:
                  active:
                    type: boolean
                  code:
                    type: string
                type: object
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated user profile with services
          schema:
            $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.User'
        "400":
          description: Invalid request body or service codes
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Failed to update services
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update streaming service subscriptions
      tags:
      - Services
  /api/search:
    get:
      description: Search for movies or TV shows via TMDb API with pagination and
        filters
      parameters:
      - description: Search query string
        in: query
        name: query
        required: true
        type: string
      - default: movie
        description: 'Content type: movie or tv'
        enum:
        - movie
        - tv
        in: query
        name: type
        type: string
      - default: 1
        description: Page number for pagination (1-1000)
        in: query
        maximum: 1000
        minimum: 1
        name: page
        type: integer
      - default: false
        description: Include adult content in results
        in: query
        name: include_adult
        type: boolean
      - default: en-US
        description: ISO 639-1 language code
        in: query
        name: language
        type: string
      - default: US
        description: ISO 3166-1 region code
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Search results with pagination
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "502":
          description: Upstream TMDb API error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "503":
          description: Search service unavailable
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "504":
          description: Upstream TMDb API timed out
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search movies and TV shows
      tags:
      - Content Discovery
  /api/watchlist:
    get:
      description: 'Get the user''s watchlist with title metadata and streaming availability
        attached to every item, with optional filtering, sorting and pagination. Availability
        comes from stored data: the request costs two database queries regardless
        of list size. The Server-Timing response header reports the database, TMDb
        and total durations.'
      parameters:
      - default: 20
        description: Number of items to return (0 for all, max 1000)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        name: offset
        type: integer
      - description: Filter by status
        enum:
        - planned
        - watching
        - finished
        in: query
        name: status
        type: string
      - description: Filter by content type
        enum:
        - movie
        - show
        in: query
        name: type
        type: string
      - description: Case-insensitive search in title
        in: query
        name: search
        type: string
      - collectionFormat: multi
        description: Keep items streaming on any of these service codes (repeat the
          parameter or separate with commas)
        in: query
        items:
          type: string
        name: service
        type: array
      - description: Keep items that are (true) or are not (false) streaming on one
          of the user's active services
        in: query
        name: available
        type: boolean
      - default: -added_at
        description: 'Sort field (prefix with - for descending): added_at, title,
          year, status, rating, runtime, available'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Watchlist items with pagination metadata and facets
          headers:
            Server-Timing:
              description: db, tmdb and total durations in milliseconds
              type: string
          schema:
            $ref: '#/definitions/internal_server.WatchlistListResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Failed to fetch items
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List watchlist items
      tags:
      - Watchlist
    post:
      consumes:
      - application/json
      description: Create a new movie or TV show entry in the user's watchlist
      parameters:
      - description: Watchlist item to create
        in: body
        name: body
        required: true
        schema:
          properties:
            imdb_id:
              type: string
            status:
              type: string
            tags:
              items:
                type: string
              type: array
            title:
              type: string
            tmdb_id:
              type: integer
            type:
              type: string
            year:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created watchlist item
          schema:
            $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.WatchlistItem'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "409":
          description: Duplicate item
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Failed to create item
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add item to watchlist
      tags:
      - Watchlist
  /api/watchlist/{id}:
    delete:
      description: Remove an item from the user's watchlist
      parameters:
      - description: Watchlist item ID (MongoDB ObjectID hex string)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion confirmation message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Delete failed
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete watchlist item
      tags:
      - Watchlist
    patch:
      consumes:
      - application/json
      description: Update an existing watchlist item's details
      parameters:
      - description: Watchlist item ID (MongoDB ObjectID hex string)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          properties:
            status:
              type: string
            tags:
              items:
                type: string
              type: array
            title:
              type: string
            tmdb_id:
              type: integer
            year:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated watchlist item
          schema:
            $ref: '#/definitions/github_com_neilsmahajan_watchlist-notify_internal_models.WatchlistItem'
        "400":
          description: Invalid ID or request body
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "409":
          description: Duplicate item
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Update failed
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update watchlist item
      tags:
      - Watchlist
  /api/watchlist/import:
    post:
      consumes:
      - multipart/form-data
      description: Bulk import watchlist items from an IMDb CSV export (any CSV with
        a "Const" column of IMDb title IDs). Rows the user already has are counted
        as duplicates and cost nothing. New titles are added as planned items with
        source "csv". An import only ever adds; it never removes or changes an item.
        When TMDb is slow, the rows that could not be looked up in time are reported
        in "errors"; uploading the same file again continues where it stopped.
      parameters:
      - description: CSV file containing watchlist items (max 10MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Import results with counts
          schema:
            $ref: '#/definitions/internal_server.WatchlistImportResponse'
        "400":
          description: Invalid file or format, or no row could be imported
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Import failed
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "503":
          description: Import service unavailable
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Import watchlist from CSV
      tags:
      - Watchlist
  /health:
    get:
      description: Reports whether the API can reach its database. A failed check
        answers 503 and the process keeps running.
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - System
schemes:
- https
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token from Auth0 authentication.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
